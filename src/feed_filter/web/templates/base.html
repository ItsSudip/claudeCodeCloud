<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}The Feed Filter{% endblock %}</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --text:#e6e6e6; --muted:#9aa3b2; --accent:#7cc4ff; --border:#262a33; }
  @media (prefers-color-scheme: light) { :root { --bg:#f7f7f8; --panel:#fff; --text:#1b1f27; --muted:#5b6472; --accent:#0b6bcb; --border:#e3e6ea; } }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  header { padding:16px 24px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; } header .muted { font-size:13px; }
  .layout { display:grid; grid-template-columns:280px 1fr; min-height:calc(100vh - 60px); }
  @media (max-width:800px) { .layout { grid-template-columns:1fr; } aside { border-right:none; border-bottom:1px solid var(--border); } }
  aside { border-right:1px solid var(--border); padding:16px; background:var(--panel); }
  aside ul { list-style:none; margin:0; padding:0; } aside li { margin:0 0 6px; }
  aside li.active a { font-weight:600; }
  main { padding:24px; max-width:900px; }
  .muted { color:var(--muted); }
  .stats { display:flex; gap:12px; flex-wrap:wrap; margin:0 0 20px; }
  .stat { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:10px 14px; min-width:120px; }
  .stat b { display:block; font-size:22px; }
  article h1 { font-size:26px; margin-top:0; } article h2 { margin-top:32px; padding-bottom:6px; border-bottom:1px solid var(--border); }
  article h3 { margin-bottom:4px; } article blockquote { margin:0 0 16px; padding:8px 14px; border-left:3px solid var(--accent); background:var(--panel); }
  article ul { padding-left:20px; } article hr { border:none; border-top:1px solid var(--border); margin:28px 0; }
  table { border-collapse:collapse; width:100%; } td, th { text-align:left; padding:8px 6px; border-bottom:1px solid var(--border); }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; background:var(--panel); border:1px solid var(--border); font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1><a href="{{ home_url | default("/") }}">The Feed Filter</a> <span class="muted">· Daily Digests</span></h1>
  <span class="muted">v{{ version }}{% if not static %} · <a href="/api/docs">API</a>{% endif %}</span>
</header>
{% block body %}{% endblock %}
</body>
</html>
